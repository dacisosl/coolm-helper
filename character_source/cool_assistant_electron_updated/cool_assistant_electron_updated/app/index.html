<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿨 비서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="쿨 비서 데스크톱 캐릭터">
    <section id="bubble" class="bubble" aria-live="polite">
      무엇을 도와드릴까요?
    </section>

    <div class="drag-bar" title="이 부분을 잡고 이동하세요">
      <span>COOL 비서</span>
      <div class="window-buttons">
        <button id="hideButton" title="숨기기">―</button>
        <button id="quitButton" title="종료">×</button>
      </div>
    </div>

    <img id="assistant" src="assets/idle.png" alt="기본 대기 중인 쿨 비서" draggable="false">

    <nav class="pose-menu" aria-label="포즈 선택">
      <button data-pose="idle">기본</button>
      <button data-pose="sleep">수면</button>
      <button data-pose="schedule">일정</button>
      <button data-pose="surprise">놀람</button>
    </nav>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
